  <style>
    /* ══ v4.0.0 ══ */
    :root{--p:#0d5c9e;--pd:#0a4578;--acc:#e8473f;--bg:#eef2f7;--sur:#fff;--brd:#dde4ed;--tx:#1a2639;--mu:#5a6a80;--sh1:0 1px 4px rgba(0,0,0,.07);--sh2:0 4px 16px rgba(0,0,0,.10);--r:10px;}
    body.disaster{--p:#b71c1c;--pd:#7f0000;--bg:#fff5f5;--brd:#fecaca;}
    body.disaster .nav{background:linear-gradient(135deg,#b71c1c,#e53935)!important;}
    body.disaster .abar{background:linear-gradient(135deg,#7f0000,#b71c1c)!important;}

    html{scroll-behavior:smooth}

    ::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:#bcc5d0;border-radius:3px}

    .disaster-banner{background:#7f0000;color:#fff;text-align:center;padding:7px;font-size:13px;font-weight:700;position:sticky;top:0;z-index:1200;animation:dblink 1.2s infinite}

    .abar{background:linear-gradient(135deg,#b71c1c,#e53935);color:#fff;padding:8px 14px;position:sticky;top:0;z-index:1100;box-shadow:0 2px 8px rgba(183,28,28,.35)}

    .abar-nums{display:flex;gap:6px;flex-wrap:wrap;padding-top:6px;border-top:1px solid rgba(255,255,255,.2);margin-top:6px}
    .cbtn{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.4);color:#fff;font-family:'Hind Siliguri',sans-serif;font-weight:700;font-size:12px;padding:4px 12px;border-radius:20px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .2s}

    .nbrand{display:flex;align-items:center;gap:11px}
    .nlogo{width:42px;height:42px;background:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0}
    .ntxt h1{font-family:'Noto Serif Bengali',serif;font-size:15px;font-weight:700;line-height:1.25}

    .ver-badge{font-size:10px;opacity:.45;padding:2px 6px;border:1px solid rgba(255,255,255,.2);border-radius:10px}

    .wrap{max-width:1400px;margin:0 auto;padding:18px 14px;display:grid;grid-template-columns:285px 1fr;gap:18px;align-items:start}
    .sidebar{display:flex;flex-direction:column;gap:12px;position:sticky;top:128px}
    .card{background:var(--sur);border-radius:var(--r);box-shadow:var(--sh1);border:1px solid var(--brd);overflow:hidden}

    .stitle{font-family:'Noto Serif Bengali',serif;font-size:18px;font-weight:700;color:var(--p);margin-bottom:3px}

    .coming-soon{text-align:center;padding:60px 20px;background:linear-gradient(135deg,#fef2f2,#fff5f5);border-radius:var(--r);border:2px dashed #fca5a5}

    .weather-card{background:linear-gradient(135deg,#0d5c9e,#1976d2);color:#fff;border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--sh2)}
    .weather-main{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
    .weather-temp{font-size:48px;font-weight:700;line-height:1}

    .weather-details{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;border-top:1px solid rgba(255,255,255,.2);padding-top:12px}
    .wd-item{text-align:center}
    .wd-item .val{font-size:15px;font-weight:700}

    /* ══ FLOOD ALERT ══ */
    .flood-card{border-radius:var(--r);padding:14px;margin-bottom:14px}
    .flood-card.safe{background:linear-gradient(135deg,#f0fdf4,#dcfce7);border:1px solid #86efac}
    .flood-card.warn{background:linear-gradient(135deg,#fef9c3,#fef08a);border:1px solid #fde047}
    .flood-card.danger{background:linear-gradient(135deg,#fef2f2,#fee2e2);border:1px solid #fca5a5}

    .flood-header h3{font-size:15px;font-weight:700}
    .river-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(0,0,0,.06);font-size:13px}
    .river-row:last-child{border-bottom:none}
    .river-level{font-weight:700;font-size:13px}
    .prog-wrap{flex:1;margin:0 10px;height:6px;background:rgba(0,0,0,.1);border-radius:10px;overflow:hidden}
    .prog-fill{height:100%;border-radius:10px;transition:width .4s}

    /* ══ VISITOR COUNTER ══ */
    .counter-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:16px}
    .counter-card{background:var(--sur);border:1px solid var(--brd);border-radius:var(--r);padding:14px;text-align:center;box-shadow:var(--sh1)}
    .counter-card .num{font-size:26px;font-weight:700;color:var(--p);font-family:'Noto Serif Bengali',serif}
    .counter-card .lbl{font-size:11px;color:var(--mu);margin-top:3px}

    /* ══ PRINT ══ */
    @media print{
      .abar,.nav,.sidebar,.mob-sb-wrap,.dtabs,.tabs,.btn-p,.btn-s,.btn-d,.toast,.moverlay,.disaster-banner{display:none!important}
      .wrap{grid-template-columns:1fr!important;padding:0!important}
      .scard{break-inside:avoid;box-shadow:none!important;border:1px solid #ccc!important}
      body{background:#fff!important;font-size:12px!important}
    }

    /* ══ MOBILE ══ */
    @media(max-width:960px){
      .wrap{display:flex;flex-direction:column;padding:14px 10px}
      .main-content{order:1}
      .mob-sb-wrap{order:2;margin-top:16px}
      .sidebar{position:static;top:0}
      .stats{grid-template-columns:repeat(2,1fr)}
      .sgrid{grid-template-columns:1fr}
      .info-grid{grid-template-columns:1fr}
      .weather-details{grid-template-columns:repeat(3,1fr)}
    }

      .nav{padding:0 12px;height:56px}

      .wrap{display:grid;grid-template-columns:285px 1fr}
      .main-content{order:2}
      .mob-sb-wrap{order:1}
      .sidebar{display:flex}

  </style>

<body>
<div id="root"></div>
<script type="text/babel">
/* ══ v4.0.0 ══ */
const VER="v4.0.0";
const KEYS={services:"pub_services",alerts:"pub_alerts",reports:"pub_reports",volunteers:"pub_volunteers",ratings:"pub_ratings",disaster:"disaster_mode",visits:"pub_visits",pageviews:"pub_pageviews"};
const OWM_KEY="4b8bcdb56b1fe04a36c5c23b39574019"; /* OpenWeatherMap free key */

/* ── bilingual search ── */
const EN_BN={"hospital":"হাসপাতাল","police":"থানা","fire":"ফায়ার সার্ভিস","ambulance":"অ্যাম্বুলেন্স","sylhet":"সিলেট","moulvibazar":"মৌলভীবাজার","habiganj":"হবিগঞ্জ","sunamganj":"সুনামগঞ্জ","emergency":"জরুরি","open":"open","closed":"closed"};
function matchService(s,q){
  if(!q)return true;
  const low=q.toLowerCase();
  const bn=EN_BN[low]||q;
  return[s.name,s.upazila,s.district,s.phone,s.type,s.dutyOfficer,s.address].some(v=>(v||"").toLowerCase().includes(low)||(v||"").toLowerCase().includes(bn.toLowerCase()));
}

function haversine(a,b,c,d){const R=6371,dL=(c-a)*Math.PI/180,dG=(d-b)*Math.PI/180;const x=Math.sin(dL/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dG/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}

/* ── Bangla date ── */
function getBanglaDate(){
  const d=new Date();
  const days=["রবিবার","সোমবার","মঙ্গলবার","বুধবার","বৃহস্পতিবার","শুক্রবার","শনিবার"];
  const months=["জানুয়ারি","ফেব্রুয়ারি","মার্চ","এপ্রিল","মে","জুন","জুলাই","আগস্ট","সেপ্টেম্বর","অক্টোবর","নভেম্বর","ডিসেম্বর"];
  const sfx=["","লা","রা","রা","ঠা","ই","ই","ই","ই","ই","ই","ই","ই","ই","ই","ই","ই","ই","ই","শে","শে","শে","শে","শে","শে","শে","শে","শে","শে","শে","শে","শে"];
  const dt=d.getDate();
  return`আজ ${days[d.getDay()]}, ${dt}${sfx[dt]||""} ${months[d.getMonth()]} ${d.getFullYear()}`;
}

/* ── visitor counter ── */
function trackVisit(){
  const today=new Date().toISOString().slice(0,10);
  const visits=loadData(KEYS.visits,{total:0,today:0,date:""});
  const pv=loadData(KEYS.pageviews,[]);
  if(visits.date!==today){visits.today=0;visits.date=today;}
  visits.total+=1;visits.today+=1;
  saveData(KEYS.visits,visits);
  const dayKey=today;
  const existing=pv.find(p=>p.d===dayKey);
  if(existing)existing.v+=1;else pv.push({d:dayKey,v:1});
  if(pv.length>30)pv.shift();
  saveData(KEYS.pageviews,pv);
  return visits;
}

/* ── Data hook ── */
function useAppData(){
  const[services,setServices]=React.useState(()=>loadData(KEYS.services,DEFAULT_SERVICES));
  const[alerts,setAlerts]=React.useState(()=>loadData(KEYS.alerts,DEFAULT_ALERTS));
  const[ratings,setRatings]=React.useState(()=>loadData(KEYS.ratings,{}));
  const[disaster,setDisaster]=React.useState(()=>loadData(KEYS.disaster,false));
  const[lastUpdate,setLastUpdate]=React.useState(new Date());
  React.useEffect(()=>{
    const sync=()=>{setServices(loadData(KEYS.services,DEFAULT_SERVICES));setAlerts(loadData(KEYS.alerts,DEFAULT_ALERTS));setRatings(loadData(KEYS.ratings,{}));const d=loadData(KEYS.disaster,false);setDisaster(d);document.body.classList.toggle("disaster",d);setLastUpdate(new Date());};
    window.addEventListener("storage",sync);const id=setInterval(sync,2000);
    return()=>{window.removeEventListener("storage",sync);clearInterval(id);};
  },[]);
  React.useEffect(()=>{document.body.classList.toggle("disaster",disaster);},[disaster]);
  return{services,alerts,ratings,setRatings,disaster,lastUpdate};
}

/* ══ WEATHER & FLOOD ══ */
function WeatherFlood({lang}){
  const[wx,setWx]=React.useState(null);
  const[loading,setLoading]=React.useState(true);

  /* Sylhet coords */
  React.useEffect(()=>{
    fetch(`https://api.openweathermap.org/data/2.5/weather?lat=24.9045&lon=91.8611&appid=${OWM_KEY}&units=metric&lang=bn`)
      .then(r=>r.json()).then(d=>{setWx(d);setLoading(false);})
      .catch(()=>setLoading(false));
  },[]);

  /* Static river data (real API would need govt BWDB) */
  const rivers=[
    {name:"সুরমা নদী, সিলেট",current:9.2,danger:8.5,unit:"মি"},
    {name:"কুশিয়ারা নদী, জকিগঞ্জ",current:7.8,danger:8.0,unit:"মি"},
    {name:"মনু নদী, মৌলভীবাজার",current:5.1,danger:6.2,unit:"মি"},
    {name:"সুরমা নদী, সুনামগঞ্জ",current:8.9,danger:8.5,unit:"মি"},
  ];

  const getFloodStatus=(cur,dan)=>{
    const r=cur/dan;
    if(r>=1)return{cls:"danger",icon:"🔴",lbl:lang==="bn"?"বিপদসীমার উপরে":"Above danger level",clr:"#dc2626"};
    if(r>=0.85)return{cls:"warn",icon:"🟡",lbl:lang==="bn"?"সতর্কতা":"Warning",clr:"#92400e"};
    return{cls:"safe",icon:"🟢",lbl:lang==="bn"?"স্বাভাবিক":"Normal",clr:"#15803d"};
  };

  const wxIcon={
    "Clear":"☀️","Clouds":"⛅","Rain":"🌧️","Drizzle":"🌦️",
    "Thunderstorm":"⛈️","Snow":"❄️","Mist":"🌫️","Haze":"🌫️","Fog":"🌫️"
  };

  return(<div>
    {/* Weather Card */}
    {loading&&<div className="weather-card"><p style={{opacity:.8}}>{lang==="bn"?"আবহাওয়া তথ্য লোড হচ্ছে...":"Loading weather..."}</p></div>}
    {!loading&&!wx&&<div className="weather-card"><p style={{opacity:.8}}>{lang==="bn"?"আবহাওয়া তথ্য পাওয়া যায়নি।":"Weather data unavailable."}</p></div>}
    {wx&&wx.main&&(
      <div className="weather-card">
        <div className="weather-main">
          <div>
            <div className="weather-temp">{Math.round(wx.main.temp)}°C</div>
            <p style={{fontSize:"13px",opacity:.8,marginTop:"4px"}}>{wxIcon[wx.weather?.[0]?.main]||"🌡️"} {wx.weather?.[0]?.description||""}</p>
          </div>
          <div className="weather-info">
            <h3>🏛️ {lang==="bn"?"সিলেট বিভাগ":"Sylhet Division"}</h3>
            <p>{lang==="bn"?"অনুভূত তাপমাত্রা":"Feels like"}: {Math.round(wx.main.feels_like)}°C</p>
            <p style={{fontSize:"11px",marginTop:"4px",opacity:.7}}>{lang==="bn"?"উৎস: OpenWeatherMap":"Source: OpenWeatherMap"}</p>
          </div>
        </div>
        <div className="weather-details">
          <div className="wd-item"><div className="val">{wx.main.humidity}%</div><div className="lbl">{lang==="bn"?"আর্দ্রতা":"Humidity"}</div></div>
          <div className="wd-item"><div className="val">{Math.round((wx.wind?.speed||0)*3.6)} km/h</div><div className="lbl">{lang==="bn"?"বায়ু":"Wind"}</div></div>
          <div className="wd-item"><div className="val">{wx.visibility?Math.round(wx.visibility/1000)+"km":"—"}</div><div className="lbl">{lang==="bn"?"দৃশ্যমানতা":"Visibility"}</div></div>
        </div>
      </div>
    )}

    {/* Flood Status */}
    <p className="stitle" style={{marginBottom:"10px"}}>🌊 {lang==="bn"?"নদীর পানির স্তর":"River Water Levels"}</p>
    {rivers.map((r,i)=>{
      const st=getFloodStatus(r.current,r.danger);
      const pct=Math.min(Math.round(r.current/r.danger*100),100);
      return(
        <div key={i} className={`flood-card ${st.cls}`}>
          <div className="flood-header">
            <span style={{fontSize:"20px"}}>{st.icon}</span>
            <div>
              <h3 style={{color:st.clr}}>{r.name}</h3>
              <p style={{fontSize:"12px",color:st.clr,opacity:.8}}>{st.lbl}</p>
            </div>
          </div>
          <div className="river-row">
            <span style={{fontSize:"12px",color:"var(--mu)"}}>{lang==="bn"?"বর্তমান স্তর":"Current"}</span>
            <div className="prog-wrap"><div className="prog-fill" style={{width:`${pct}%`,background:pct>=100?"#dc2626":pct>=85?"#f59e0b":"#22c55e"}}></div></div>
            <span className="river-level" style={{color:st.clr}}>{r.current} {r.unit}</span>
          </div>
          <div className="river-row">
            <span style={{fontSize:"12px",color:"var(--mu)"}}>{lang==="bn"?"বিপদসীমা":"Danger level"}</span>
            <div style={{flex:1}}></div>
            <span style={{fontSize:"12px",fontWeight:600,color:"#dc2626"}}>{r.danger} {r.unit}</span>
          </div>
        </div>
      );
    })}
    <p style={{fontSize:"11px",color:"var(--mu)",marginTop:"8px"}}>
      * {lang==="bn"?"নদীর তথ্য BWDB ডেমো ডেটা। সরকারি তথ্য পেতে:":"River data is demo. For official data:"}
      <a href="http://www.ffwc.gov.bd" target="_blank" style={{color:"var(--p)",fontWeight:600}}> ffwc.gov.bd</a>
    </p>
  </div>);
}

/* ══ VISITOR STATS ══ */
function VisitorStats({lang}){
  const[visits]=React.useState(()=>loadData(KEYS.visits,{total:0,today:0,date:""}));
  const[pv]=React.useState(()=>loadData(KEYS.pageviews,[]));
  const chartRef=React.useRef(null);
  const chartObj=React.useRef(null);
  React.useEffect(()=>{
    if(!chartRef.current||pv.length<2)return;
    if(chartObj.current)chartObj.current.destroy();
    chartObj.current=new Chart(chartRef.current,{
      type:"line",
      data:{
        labels:pv.map(p=>p.d.slice(5)),
        datasets:[{label:lang==="bn"?"ভিজিট":"Visits",data:pv.map(p=>p.v),borderColor:"#2563eb",backgroundColor:"rgba(37,99,235,.1)",tension:.4,fill:true,pointRadius:3}]
      },
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{stepSize:1}}}}
    });
  },[pv,lang]);

  const today=new Date().toISOString().slice(0,10);
  const todayV=pv.find(p=>p.d===today)?.v||visits.today||0;

  return(<div>
    <div className="counter-grid">
      {[
        {num:visits.total||0,lbl:lang==="bn"?"মোট ভিজিট":"Total Visits",icon:"👁️"},
        {num:todayV,lbl:lang==="bn"?"আজকের ভিজিট":"Today's Visits",icon:"📅"},
        {num:pv.length,lbl:lang==="bn"?"সক্রিয় দিন":"Active Days",icon:"📆"},
        {num:pv.length?Math.round(pv.reduce((a,b)=>a+b.v,0)/pv.length):0,lbl:lang==="bn"?"দৈনিক গড়":"Daily Avg",icon:"📊"},
      ].map((c,i)=>(
        <div key={i} className="counter-card">
          <div style={{fontSize:"22px",marginBottom:"4px"}}>{c.icon}</div>
          <div className="num">{c.num.toLocaleString()}</div>
          <div className="lbl">{c.lbl}</div>
        </div>
      ))}
    </div>
    {pv.length>=2&&(
      <div className="card">
        <div className="ch">📈 {lang==="bn"?"ভিজিটের ট্রেন্ড (৩০ দিন)":"Visit Trend (30 days)"}</div>
        <div className="cb"><div className="chart-wrap"><canvas ref={chartRef}></canvas></div></div>
      </div>
    )}
    {pv.length<2&&<div className="empty"><div className="ei">📊</div><p>{lang==="bn"?"আরো ভিজিটের পরে চার্ট দেখাবে।":"Chart will appear after more visits."}</p></div>}
  </div>);
}

/* ══ GOOGLE MAP ══ */
function GoogleMap({services,district,lang}){
  const mapRef=React.useRef(null);
  const gMapRef=React.useRef(null);
  const markersRef=React.useRef([]);
  const userMarkRef=React.useRef(null);
  const[locLoading,setLocLoading]=React.useState(false);
  const[nearest,setNearest]=React.useState(null);
  const PIN_COLORS={"হাসপাতাল":"e74c3c","থানা":"3b82f6","ফায়ার সার্ভিস":"f97316","অ্যাম্বুলেন্স":"22c55e"};
  React.useEffect(()=>{
    if(!mapRef.current||gMapRef.current)return;
    gMapRef.current=new window.google.maps.Map(mapRef.current,{center:{lat:24.7,lng:91.5},zoom:9,mapTypeControl:false,streetViewControl:false});
  },[]);
  React.useEffect(()=>{
    if(!gMapRef.current)return;
    markersRef.current.forEach(m=>m.setMap(null));markersRef.current=[];
    const c=DISTRICT_CENTER[district]||[24.7,91.5];
    gMapRef.current.setCenter({lat:c[0],lng:c[1]});
    gMapRef.current.setZoom(district==="সব জেলা"?9:10);
    const iw=new window.google.maps.InfoWindow();
    services.forEach(svc=>{
      const meta=TYPE_META[svc.type]||{icon:"📍",pin:"#888"};
      const clr=PIN_COLORS[svc.type]||"888888";
      const mk=new window.google.maps.Marker({
        position:{lat:svc.lat,lng:svc.lng},map:gMapRef.current,title:svc.name,
        icon:{url:`https://chart.googleapis.com/chart?chst=d_map_pin_letter&chld=%E2%80%A2|${clr}|ffffff`,scaledSize:new window.google.maps.Size(26,40)}
      });
      mk.addListener("click",()=>{
        iw.setContent(`<div style="font-family:'Hind Siliguri',sans-serif;min-width:200px;padding:4px">
          <p style="font-weight:700;font-size:14px;margin-bottom:4px">${meta.icon} ${svc.name}</p>
          <p style="font-size:12px;color:#5a6a80;margin-bottom:3px">🏘️ ${svc.upazila} · ${svc.district}</p>
          <p style="font-size:12px;margin-bottom:3px">📞 <strong><a href="tel:${svc.phone}" style="color:#0d5c9e">${svc.phone}</a></strong></p>
          <p style="font-size:12px;margin-bottom:5px">👤 ${svc.dutyOfficer}</p>
          <span style="background:${svc.status==="open"?"#dcfce7":"#fee2e2"};color:${svc.status==="open"?"#15803d":"#dc2626"};padding:2px 9px;border-radius:10px;font-size:11px;font-weight:700">${svc.status==="open"?"● খোলা":"● বন্ধ"}</span>
        </div>`);
        iw.open(gMapRef.current,mk);
      });
      markersRef.current.push(mk);
    });
  },[services,district]);
  const findLocation=()=>{
    if(!navigator.geolocation){alert("Geolocation সাপোর্ট নেই।");return;}
    setLocLoading(true);
    navigator.geolocation.getCurrentPosition(pos=>{
      const{latitude:lat,longitude:lng}=pos.coords;
      setLocLoading(false);
      if(userMarkRef.current)userMarkRef.current.setMap(null);
      userMarkRef.current=new window.google.maps.Marker({position:{lat,lng},map:gMapRef.current,title:lang==="bn"?"আপনার অবস্থান":"Your location",icon:{url:"https://maps.google.com/mapfiles/ms/icons/blue-dot.png"}});
      gMapRef.current.setCenter({lat,lng});gMapRef.current.setZoom(12);
      let minD=Infinity,near=null;
      services.forEach(s=>{const d=haversine(lat,lng,s.lat,s.lng);if(d<minD){minD=d;near=s;}});
      if(near)setNearest({...near,dist:minD.toFixed(1)});
    },()=>{setLocLoading(false);alert("লোকেশন পাওয়া যায়নি।");});
  };
  return(<div>
    <div style={{display:"flex",gap:"8px",marginBottom:"10px",flexWrap:"wrap"}}>
      <button className="btn-p" style={{padding:"8px 15px",fontSize:"13px"}} onClick={findLocation} disabled={locLoading}>{locLoading?"⏳ খুঁজছি...":"📍 "+(lang==="bn"?"আমার অবস্থান":"My Location")}</button>
      {nearest&&<button className="btn-s" style={{padding:"8px 15px",fontSize:"13px"}} onClick={()=>{setNearest(null);if(userMarkRef.current)userMarkRef.current.setMap(null);}}>✕</button>}
    </div>
    {nearest&&<div className="dist-result">🎯 {lang==="bn"?"নিকটতম":"Nearest"}: <strong>{nearest.name}</strong> — {nearest.dist} km | 📞 <a href={`tel:${nearest.phone}`} style={{color:"#1e40af"}}>{nearest.phone}</a></div>}
    <div ref={mapRef} id="gmap"></div>
    <div className="mleg">
      {Object.entries(TYPE_META).map(([k,v])=><div key={k} className="mli"><span className="mld" style={{background:v.pin}}></span>{k}</div>)}
      <div className="mli"><span className="mld" style={{background:"#2563eb"}}></span>{lang==="bn"?"আপনার অবস্থান":"Your location"}</div>
    </div>
  </div>);
}

/* ══ STATS CHARTS ══ */
function StatsCharts({services,lang}){
  const barRef=React.useRef(null);const pieRef=React.useRef(null);
  const bc=React.useRef(null);const pc=React.useRef(null);
  React.useEffect(()=>{
    if(!barRef.current||!pieRef.current)return;
    if(bc.current)bc.current.destroy();if(pc.current)pc.current.destroy();
    const dists=Object.keys(DISTRICTS_DATA);
    bc.current=new Chart(barRef.current,{type:"bar",data:{labels:dists,datasets:[{label:lang==="bn"?"সেবা কেন্দ্র":"Services",data:dists.map(d=>services.filter(s=>s.district===d).length),backgroundColor:["#3b82f6","#10b981","#f59e0b","#8b5cf6"],borderRadius:6}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{stepSize:1}}}}});
    pc.current=new Chart(pieRef.current,{type:"doughnut",data:{labels:SERVICE_TYPES,datasets:[{data:SERVICE_TYPES.map(t=>services.filter(s=>s.type===t).length),backgroundColor:["#ef4444","#3b82f6","#f97316","#22c55e"],borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom",labels:{font:{family:"Hind Siliguri",size:11}}}}}});
  },[services,lang]);
  return(
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"14px",marginBottom:"16px"}}>
      <div className="card"><div className="ch">📊 {lang==="bn"?"জেলাভিত্তিক":"By District"}</div><div className="cb"><div className="chart-wrap"><canvas ref={barRef}></canvas></div></div></div>
      <div className="card"><div className="ch">🥧 {lang==="bn"?"সেবার ধরন":"Types"}</div><div className="cb"><div className="chart-wrap"><canvas ref={pieRef}></canvas></div></div></div>

}

/* ══ BED TRACKER ══ */
function BedTracker({services,lang}){
  const hospitals=services.filter(s=>s.type==="হাসপাতাল"&&s.beds);
  if(!hospitals.length)return null;
  return(
    <div className="card" style={{marginBottom:"16px"}}>
      <div className="ch">🛏️ {lang==="bn"?"হাসপাতাল শয্যা":"Hospital Beds"}</div>
      <div className="cb">
        {hospitals.map(h=>{
          const total=parseInt((h.beds||"0").replace(/\D/g,""))||0;
          const occ=Math.floor(total*0.62);
          const pct=total?Math.round(occ/total*100):0;
          return(<div key={h.id} style={{marginBottom:"11px"}}>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:"12px",marginBottom:"3px"}}>
              <span style={{fontWeight:500}}>{h.name}</span>
              <span style={{color:"var(--mu)"}}>{occ}/{total} ({pct}%)</span>
            </div>
            <div style={{height:"7px",background:"#e2e8f0",borderRadius:"10px",overflow:"hidden"}}>
              <div style={{height:"100%",width:`${pct}%`,background:pct>80?"#ef4444":pct>60?"#f59e0b":"#22c55e",borderRadius:"10px"}}></div>
            </div>
          </div>);
        })}
      </div>
    </div>
  );
}

        {[["🆘","জরুরি","Emergency","999"],["ℹ️","তথ্য","Info","333"],["⚖️","দুদক","ACC","109"],["🩸","রক্ত","Blood","16430"],["🚒","ফায়ার","Fire","102"],["🚑","অ্যাম্বুলেন্স","Ambulance","199"]].map(([i,lbn,len,n])=>(
          <a key={n} href={`tel:${n}`} className="enum-row">
            <span style={{fontSize:"13px"}}>{i} {lang==="bn"?lbn:len}</span>
            <span className="enum-num">{n}</span>
          </a>
        ))}
      </div>
    </div>
  </div>);
}

/* ══ MAIN APP ══ */
function App(){
  const{services,alerts,ratings,setRatings,disaster,lastUpdate}=useAppData();
  const[selDistrict,setSelDistrict]=React.useState("সব জেলা");
  const[selUpazila,setSelUpazila]=React.useState("");
  const[selType,setSelType]=React.useState("");
  const[query,setQuery]=React.useState("");
  const[tab,setTab]=React.useState("services");
  const[showReport,setShowReport]=React.useState(false);
  const[showVol,setShowVol]=React.useState(false);
  const[toast,setToast]=React.useState(null);
  const[lang,setLang]=React.useState("bn");

  React.useEffect(()=>{
    document.documentElement.setAttribute("lang",lang);
    trackVisit();
  },[]);
  React.useEffect(()=>{document.documentElement.setAttribute("lang",lang);},[lang]);

  const showToast=(m)=>{setToast(m);setTimeout(()=>setToast(null),3400);};
  const hasFilter=selDistrict!=="সব জেলা"||selUpazila||selType||query;
  const clearFilter=()=>{setSelDistrict("সব জেলা");setSelUpazila("");setSelType("");setQuery("");};

  const fServices=React.useMemo(()=>services.filter(s=>{
    return(selDistrict==="সব জেলা"||s.district===selDistrict)&&(!selUpazila||s.upazila===selUpazila)&&(!selType||s.type===selType)&&matchService(s,query);
  }),[services,query,selDistrict,selUpazila,selType]);

  const handleRate=(svcId,stars)=>{
    const prev=ratings[svcId]||{avg:0,count:0};const nc=prev.count+1;
    const next={...ratings,[svcId]:{avg:((prev.avg*prev.count)+stars)/nc,count:nc}};
    setRatings(next);saveData(KEYS.ratings,next);showToast("⭐ "+(lang==="bn"?"রেটিং দেওয়ার জন্য ধন্যবাদ!":"Thanks for rating!"));
  };

  const TABS=[
    ["services",lang==="bn"?"📋 সেবা":"📋 Services"],
    ["map",lang==="bn"?"🗺️ মানচিত্র":"🗺️ Map"],
    ["weather",lang==="bn"?"🌦️ আবহাওয়া":"🌦️ Weather"],
    ["donors",lang==="bn"?"🩸 রক্তদাতা":"🩸 Donors"],
    ["stats",lang==="bn"?"📊 পরিসংখ্যান":"📊 Stats"],
    ["visits",lang==="bn"?"👁️ ভিজিটর":"👁️ Visitors"],
    ["union",lang==="bn"?"🏛️ ইউনিয়ন":"🏛️ Union"],
    ["school",lang==="bn"?"🎓 শিক্ষা":"🎓 Schools"],
    ["shelter",lang==="bn"?"🏠 আশ্রয়":"🏠 Shelters"],
    ["lost",lang==="bn"?"🔍 হারানো":"🔍 Missing"],
    ["govt",lang==="bn"?"🔗 সরকারি":"🔗 Govt Links"],
  ];

  const sbProps={selDistrict,setSelDistrict,selUpazila,setSelUpazila,selType,setSelType,query,setQuery,hasFilter,onClearFilter:clearFilter,onReport:()=>setShowReport(true),onVol:()=>setShowVol(true),lang,onNotif:()=>askNotif(showToast,lang),onPrint:()=>window.print()};

  return(<>
    {disaster&&<div className="disaster-banner">🚨 {lang==="bn"?"দুর্যোগ মোড সক্রিয় — জরুরি তথ্য অগ্রাধিকার পাচ্ছে":"DISASTER MODE ACTIVE"} 🚨</div>}
    <AlertBar alerts={alerts} lang={lang}/>
    <Navbar lang={lang} setLang={setLang} onPrint={()=>window.print()}/>

    <div className="wrap">
      <div className="mob-sb-wrap"><Sidebar {...sbProps}/></div>
      <div className="main-content">
        <StatsStrip services={services} lastUpdate={lastUpdate} lang={lang}/>
        <div className="dtabs">
          {["সব জেলা",...Object.keys(DISTRICTS_DATA)].map(d=>(
            <button key={d} className={`dtab${selDistrict===d?" act":""}`} onClick={()=>{setSelDistrict(d);setSelUpazila("");}}>
              {d==="সব জেলা"?(lang==="bn"?"সব জেলা":"All"):d}
            </button>
          ))}
        </div>
        <div className="tabs">
          {TABS.map(([id,lbl])=><button key={id} className={`tbtn${tab===id?" act":""}`} onClick={()=>setTab(id)}>{lbl}</button>)}
        </div>

        {tab==="services"&&(<>
          <p className="stitle">{lang==="bn"?"সেবা কেন্দ্র তালিকা":"Service Centers"}</p>
          <p className="ssub">{fServices.length}{lang==="bn"?`টি${hasFilter?" (ফিল্টার করা)":""}`:` results${hasFilter?" (filtered)":""}`}</p>
          {fServices.length?<div className="sgrid">{fServices.map(s=><SvcCard key={s.id} s={s} ratings={ratings} onRate={handleRate} lang={lang}/>)}</div>
          :<div className="empty"><div className="ei">🔍</div><p>{lang==="bn"?"কোনো সেবা পাওয়া যায়নি।":"No services found."}</p></div>}
        </>)}

        {tab==="map"&&(<>
          <p className="stitle">{lang==="bn"?"গুগল মানচিত্র":"Google Map"}</p>
          <p className="ssub">{lang==="bn"?"পিন ক্লিক করুন · নিকটতম সেবা খুঁজুন":"Click pins · Find nearest service"}</p>
          <div className="card" style={{padding:"13px"}}><GoogleMap services={fServices} district={selDistrict} lang={lang}/></div>
        </>)}

        {tab==="weather"&&(<>
          <p className="stitle">{lang==="bn"?"আবহাওয়া ও বন্যা পূর্বাভাস":"Weather & Flood Forecast"}</p>
          <p className="ssub" style={{marginBottom:"14px"}}>{lang==="bn"?"সিলেট বিভাগের আবহাওয়া ও নদীর পানির তথ্য":"Sylhet Division weather and river water levels"}</p>
          <WeatherFlood lang={lang}/>
        </>)}

        {tab==="donors"&&<div style={{marginTop:"4px"}}><div className="coming-soon"><div className="cs-icon">🩸</div><h2>{lang==="bn"?"রক্তদাতা তালিকা — শীঘ্রই আসছে":"Blood Donors — Coming Soon"}</h2><p>{lang==="bn"?"জরুরি রক্তের প্রয়োজন হলে 16430 নম্বরে কল করুন।":"For emergency blood call 16430."}</p><a href="tel:16430" className="btn-d" style={{display:"inline-flex",marginTop:"16px",textDecoration:"none"}}>🩸 16430</a></div></div>}

        {tab==="stats"&&(<>
          <p className="stitle">{lang==="bn"?"পরিসংখ্যান ও বিশ্লেষণ":"Statistics"}</p>
          <p className="ssub" style={{marginBottom:"14px"}}>{lang==="bn"?"সেবাভিত্তিক তথ্য":"Service analysis"}</p>
          <BedTracker services={services} lang={lang}/>
          <StatsCharts services={services} lang={lang}/>
        </>)}

        {tab==="visits"&&(<>
          <p className="stitle">{lang==="bn"?"ভিজিটর পরিসংখ্যান":"Visitor Statistics"}</p>
          <p className="ssub" style={{marginBottom:"14px"}}>{lang==="bn"?"সাইটের ব্যবহারের তথ্য":"Site usage data"}</p>
          <VisitorStats lang={lang}/>
        </>)}

        {tab==="union"&&(<>
          <p className="stitle">{lang==="bn"?"ইউনিয়ন পরিষদ":"Union Parishad"}</p>
          <p className="ssub" style={{marginBottom:"13px"}}>{lang==="bn"?"স্থানীয় সরকার প্রতিনিধি":"Local government"}</p>
          <div className="info-grid">{UNION_DATA.map((u,i)=><div key={i} className="info-card" style={{borderLeft:"3px solid var(--p)"}}><h4>🏛️ {u.name}</h4><p>📍 {u.district} — {u.upazila}</p><p>👤 {lang==="bn"?"চেয়ারম্যান:":"Chairman:"} <strong>{u.chairman}</strong></p><a href={`tel:${u.phone}`}>📞 {u.phone}</a></div>)}</div>
        </>)}

        {tab==="school"&&(<>
          <p className="stitle">{lang==="bn"?"সরকারি শিক্ষা প্রতিষ্ঠান":"Govt Educational Institutions"}</p>
          <p className="ssub" style={{marginBottom:"13px"}}>{lang==="bn"?"স্কুল ও কলেজের তালিকা":"Schools and colleges"}</p>
          <div className="info-grid">{SCHOOL_DATA.map((s,i)=><div key={i} className="info-card" style={{borderLeft:"3px solid #10b981"}}><h4>🎓 {s.name}</h4><p>📍 {s.district} — {s.upazila}</p><p>📚 {lang==="bn"?"ধরন:":"Type:"} <strong>{s.type}</strong></p><a href={`tel:${s.phone}`}>📞 {s.phone}</a></div>)}</div>
        </>)}

        {tab==="shelter"&&(<>
          <p className="stitle">{lang==="bn"?"আশ্রয়কেন্দ্র":"Shelter Centers"}</p>
          <p className="ssub" style={{marginBottom:"13px"}}>{lang==="bn"?"দুর্যোগকালীন আশ্রয়কেন্দ্র":"Disaster shelters"}</p>
          <div className="info-grid">{SHELTER_DATA.map((s,i)=><div key={i} className="info-card" style={{borderLeft:`3px solid ${s.status==="open"?"#22c55e":"#ef4444"}`}}><h4>🏠 {s.name}</h4><p>📍 {s.district} — {s.upazila}</p><p>👥 {lang==="bn"?"ধারণক্ষমতা:":"Capacity:"} <strong>{s.capacity}</strong> {lang==="bn"?"জন":"people"}</p><span style={{background:s.status==="open"?"#dcfce7":"#fee2e2",color:s.status==="open"?"#15803d":"#dc2626",fontSize:"11px",fontWeight:700,padding:"2px 9px",borderRadius:"20px",display:"inline-block",marginTop:"5px"}}>{s.status==="open"?(lang==="bn"?"✅ খোলা":"✅ Open"):(lang==="bn"?"❌ বন্ধ":"❌ Closed")}</span></div>)}</div>
        </>)}

        {tab==="lost"&&<LostPersonSection lang={lang}/>}

        {tab==="govt"&&(<>
          <p className="stitle">{lang==="bn"?"সরকারি সেবার লিংক":"Government Links"}</p>
          <p className="ssub" style={{marginBottom:"13px"}}>{lang==="bn"?"অনলাইনে সরকারি সেবা গ্রহণ করুন":"Access online government services"}</p>
          <div className="info-grid">{GOVT_SERVICES.map((g,i)=><div key={i} className="info-card" style={{borderLeft:"3px solid #6366f1"}}><h4>{g.icon} {g.name}</h4><p style={{marginBottom:"8px"}}>{g.desc}</p><a href={g.url} target="_blank" rel="noopener" style={{background:"var(--p)",color:"#fff",padding:"5px 13px",borderRadius:"7px",fontSize:"12px",fontWeight:600,textDecoration:"none",display:"inline-block"}}>🔗 {lang==="bn"?"ভিজিট করুন":"Visit"}</a></div>)}</div>
        </>)}
      </div>
    </div>

    <footer style={{background:"#0a3561",color:"rgba(255,255,255,.7)",textAlign:"center",padding:"16px",marginTop:"30px",fontSize:"12px"}}>
      🏛️ <strong style={{color:"#fff"}}>সিলেটসেবা | Sylhet Sheba</strong> — {lang==="bn"?"সিলেট বিভাগীয় কমিশনারের কার্যালয়":"Sylhet Divisional Commissioner"} | {VER} | 📧 commissioner@sylhet.gov.bd
    </footer>

    {showReport&&<ReportModal onClose={()=>setShowReport(false)} onToast={showToast} lang={lang}/>}
    {showVol&&<VolModal onClose={()=>setShowVol(false)} onToast={showToast} lang={lang}/>}
    {toast&&<Toast msg={toast} onClose={()=>setToast(null)}/>}
  </>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}</script>
